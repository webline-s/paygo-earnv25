<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="120" fill="#3b82f6" opacity="0.1"/>
  <circle cx="1100" cy="530" r="150" fill="#3b82f6" opacity="0.1"/>
  
  <!-- Logo/Icon area -->
  <g transform="translate(150, 150)">
    <!-- Wallet icon background -->
    <rect x="0" y="0" width="120" height="120" rx="24" fill="url(#accentGradient)" opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Wallet icon -->
    <g transform="translate(30, 30)">
      <!-- Wallet shape -->
      <path d="M 5 20 Q 5 15 10 15 L 50 15 Q 55 15 55 20 L 55 50 Q 55 55 50 55 L 10 55 Q 5 55 5 50 Z" 
            fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Card slot -->
      <rect x="8" y="22" width="39" height="18" rx="2" fill="none" stroke="#3b82f6" stroke-width="2"/>
      
      <!-- Coins -->
      <circle cx="18" cy="48" r="5" fill="#3b82f6" opacity="0.8"/>
      <circle cx="32" cy="50" r="4" fill="#3b82f6" opacity="0.6"/>
      <circle cx="45" cy="47" r="4.5" fill="#3b82f6" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Main text -->
  <text x="300" y="210" font-size="72" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">
    PayGo
  </text>
  
  <!-- Subtitle -->
  <text x="300" y="270" font-size="28" fill="#94a3b8" font-family="Arial, sans-serif">
    Your Digital Wallet
  </text>
  
  <!-- Description -->
  <text x="300" y="330" font-size="20" fill="#cbd5e1" font-family="Arial, sans-serif">
    Digital wallet and financial services
  </text>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="580" width="1200" height="50" fill="url(#accentGradient)" opacity="0.3"/>
  
  <!-- Feature highlights -->
  <g font-size="16" fill="#e2e8f0" font-family="Arial, sans-serif">
    <text x="120" y="615">✓ Secure Transactions</text>
    <text x="500" y="615">✓ Instant Transfers</text>
    <text x="880" y="615">✓ 24/7 Support</text>
  </g>
</svg>